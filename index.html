<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Modern Hanok tone의 반응형 모바일 청첩장 웹앱"
    />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Invitation</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirectPath = params.get('p');
        if (!redirectPath) return;

        if (redirectPath.charAt(0) !== '/') {
          redirectPath = '/' + redirectPath;
        }

        var basePath = window.location.pathname.replace(/\/$/, '');
        var nextUrl = basePath + redirectPath;
        if (!basePath && redirectPath === '/') {
          nextUrl = '/';
        }

        var preservedHash = params.get('h');
        if (preservedHash) nextUrl += '#' + preservedHash;

        window.history.replaceState(null, '', nextUrl);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
